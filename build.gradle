import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}

ext {
    jmonkeyengine_version = '3.9.0-stable'
    license = file("$rootDir/license.txt")
}

def osName = System.getProperty("os.name").toLowerCase()
def isMacOs = osName.contains("mac")
def isWindows = osName.contains("windows")

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url = "https://jitpack.io" }
    }
}

application {
    applicationName = 'OpenKeeper'
    // macOS uses an AWT-free bootstrap before entering the normal game main class.
    mainClass = isMacOs ? 'toniarts.openkeeper.macos.MacLauncher' : 'toniarts.openkeeper.Main'
    if (isMacOs) {
        // GLFW must own the first thread on macOS. Headless AWT allows image
        // conversion code to work without initialising the Swing window system.
        applicationDefaultJvmArgs = [
                "-Dvisualvm.display.name=OpenKeeper",
                "-Djava.awt.headless=true",
                "-XstartOnFirstThread"
        ]
    }
    else {
        applicationDefaultJvmArgs = ["-Dvisualvm.display.name=OpenKeeper"]
    }
}

tasks.register("modelViewer", JavaExec) {
    group = ApplicationPlugin.APPLICATION_GROUP
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'toniarts.openkeeper.tools.modelviewer.ModelViewer'
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.github.nifty-gui:nifty') using module('com.github.tonihele.nifty-gui:nifty:1.4-SNAPSHOT')
        substitute module('com.github.nifty-gui:nifty-default-controls') using module('com.github.tonihele.nifty-gui:nifty-default-controls:1.4-SNAPSHOT')
        substitute module('com.github.nifty-gui:nifty-style-black') using module('com.github.tonihele.nifty-gui:nifty-style-black:1.4-SNAPSHOT')
    }
}

project(":assets") {
    apply plugin: "java"

    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("assets"))

    sourceSets {
        main {
            resources {
                srcDir(".")
                exclude("Converted/**")
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    implementation "org.jmonkeyengine:jme3-core:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-desktop:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-plugins:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-effects:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-networking:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmonkeyengine_version"
    implementation "org.jmonkeyengine:jme3-niftygui:$jmonkeyengine_version"
    implementation "com.badlogicgames.gdx:gdx-ai:1.8.2"
    implementation "javax.vecmath:vecmath:1.5.2"
    implementation "com.simsilica:zay-es:1.6.0"
    implementation "com.simsilica:zay-es-net:1.6.0"
    implementation "com.simsilica:sio2:1.8.0"
    implementation "com.simsilica:sim-ethereal:1.8.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.14.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.4"

    // Assets sub-project
    runtimeOnly project(':assets')
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' '),
            'Main-Class': application.mainClass,
            'Built-By': System.properties['user.name'],
            'Build-Timestamp': new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            'Created-By': "Gradle ${gradle.gradleVersion}",
            'Build-JDK': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
            'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
        )
    }
}

// Build a self-contained macOS disk image with the architecture-native JDK runtime.
// The actual jpackage command lives in a shell helper so Gradle's configuration
// cache never needs to serialize project/layout objects from an execution closure.
if (isMacOs) {
    def macMainJarName = tasks.named('jar').get().archiveFileName.get()
    def macMainClassName = application.mainClass.get()
    def macProjectDir = rootDir.absolutePath
    def macDmgScript = file('scripts/build-macos-dmg.sh').absolutePath

    tasks.register("macDmg", Exec) {
        group = 'distribution'
        description = 'Build a self-contained OpenKeeper DMG on macOS (arm64 or x86_64).'
        dependsOn tasks.named('installDist')
        workingDir rootDir
        environment 'OPENKEEPER_PROJECT_DIR', macProjectDir
        environment 'OPENKEEPER_MAIN_JAR', macMainJarName
        environment 'OPENKEEPER_MAIN_CLASS', macMainClassName
        commandLine '/bin/bash', macDmgScript
    }
} else {
    tasks.register("macDmg") {
        group = 'distribution'
        description = 'macOS-only DMG packaging task.'
        enabled = false
    }
}

// Build a self-contained Windows x64 portable application image and ZIP.
// Packaging is delegated to PowerShell for the same Gradle configuration-cache
// safety as the macOS helper.
if (isWindows) {
    def windowsMainJarName = tasks.named('jar').get().archiveFileName.get()
    def windowsMainClassName = application.mainClass.get()
    def windowsProjectDir = rootDir.absolutePath
    def windowsPackageScript = file('scripts/build-windows-portable.ps1').absolutePath

    tasks.register("windowsZip", Exec) {
        group = 'distribution'
        description = 'Build a self-contained OpenKeeper portable ZIP on Windows x64.'
        dependsOn tasks.named('installDist')
        workingDir rootDir
        environment 'OPENKEEPER_PROJECT_DIR', windowsProjectDir
        environment 'OPENKEEPER_MAIN_JAR', windowsMainJarName
        environment 'OPENKEEPER_MAIN_CLASS', windowsMainClassName
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', windowsPackageScript
    }
} else {
    tasks.register("windowsZip") {
        group = 'distribution'
        description = 'Windows-only portable ZIP packaging task.'
        enabled = false
    }
}

eclipse {
    classpath {
        downloadSources=true
    }
    project {
        natures 'org.springsource.ide.eclipse.gradle.core.nature'
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

compileJava {
    // disable the warnings
    options.compilerArgs += ["-Xlint:deprecation"]
    //options.compilerArgs += ["-Xlint:unchecked"]
}

wrapper {
    gradleVersion = '9.6.1'
}
