name: Windows x64 native build

on:
  push:
    branches: [ master, macos-universal ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show native architecture
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          java -version

      - name: Test and build portable Windows package
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test windowsZip --stacktrace

      - name: Verify x64 launcher and checksum
        shell: pwsh
        run: |
          $exe = 'build\windows\OpenKeeper\OpenKeeper.exe'
          $zip = 'build\windows\OpenKeeper-Windows-x86_64.zip'
          $sha = "$zip.sha256"
          if (-not (Test-Path $exe)) { throw "Missing launcher: $exe" }
          if (-not (Test-Path $zip)) { throw "Missing ZIP: $zip" }

          # PE COFF machine 0x8664 proves the jpackage launcher is AMD64/x86_64.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ('PE machine: 0x{0:X4}' -f $machine)
          if ($machine -ne 0x8664) { throw ('Expected x86_64 PE machine 0x8664, got 0x{0:X4}' -f $machine) }

          $expected = ((Get-Content $sha -Raw).Trim() -split '\s+')[0]
          $stream = [System.IO.File]::OpenRead($zip)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $actual = (($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString('x2') }) -join '')
            }
            finally {
              $sha256.Dispose()
            }
          }
          finally {
            $stream.Dispose()
          }
          if ($actual -ne $expected) { throw "SHA-256 mismatch: expected $expected got $actual" }
          Write-Host "SHA-256 OK: $actual"

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeeper-Windows-x86_64
          path: |
            build/windows/OpenKeeper-Windows-x86_64.zip
            build/windows/OpenKeeper-Windows-x86_64.zip.sha256
          if-no-files-found: error
