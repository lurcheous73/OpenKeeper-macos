name: macOS native builds

on:
  push:
    branches: [ master, macos-universal ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show native architecture
        run: |
          uname -a
          uname -m
          java -version

      - name: Test and build native DMG
        run: ./gradlew --no-daemon clean test macDmg --stacktrace

      - name: Name architecture-specific DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find build/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "build/OpenKeeper-macOS-${{ matrix.arch }}.dmg"
          shasum -a 256 "build/OpenKeeper-macOS-${{ matrix.arch }}.dmg" > "build/OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256"

      - name: Upload native macOS package
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeeper-macOS-${{ matrix.arch }}
          path: |
            build/OpenKeeper-macOS-${{ matrix.arch }}.dmg
            build/OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
