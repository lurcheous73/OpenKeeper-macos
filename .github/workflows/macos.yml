name: macOS native builds

on:
  push:
    branches: [ master, macos-universal ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show native architecture
        run: |
          uname -a
          uname -m
          java -version

      - name: Test and build native DMG
        run: ./gradlew --no-daemon clean test macDmg --stacktrace

      - name: Verify and name architecture-specific DMG
        shell: bash
        run: |
          set -euo pipefail
          source_dmg="$(find build/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$source_dmg"

          output_dmg="build/OpenKeeper-macOS-${{ matrix.arch }}.dmg"
          checksum="build/OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256"
          cp "$source_dmg" "$output_dmg"

          # Verify the disk image itself before mounting it.
          hdiutil verify "$output_dmg"

          # Mount the finished DMG and prove the packaged native launcher has
          # the architecture promised by this matrix job.
          mount_log="$(mktemp)"
          hdiutil attach -nobrowse -readonly "$output_dmg" | tee "$mount_log"
          volume="$(awk -F '\t' '/\/Volumes\// {print $NF; exit}' "$mount_log")"
          test -n "$volume"
          trap 'hdiutil detach "$volume" >/dev/null 2>&1 || true' EXIT

          app="$(find "$volume" -maxdepth 2 -type d -name 'OpenKeeper.app' -print -quit)"
          test -n "$app"
          executable="$app/Contents/MacOS/OpenKeeper"
          test -x "$executable"
          file "$executable"
          file "$executable" | grep -q '${{ matrix.arch }}'

          hdiutil detach "$volume"
          trap - EXIT

          # Store a portable checksum containing only the basename, then verify it.
          (
            cd build
            shasum -a 256 "OpenKeeper-macOS-${{ matrix.arch }}.dmg" > "OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256"
            shasum -a 256 -c "OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256"
          )

      - name: Upload native macOS package
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeeper-macOS-${{ matrix.arch }}
          path: |
            build/OpenKeeper-macOS-${{ matrix.arch }}.dmg
            build/OpenKeeper-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
